# SPDX-License-Identifier: AGPL-3.0-only
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly: notices a Wiki.js update that changes the markup the tweaks rely on.
    - cron: "41 5 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs; Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Repository hygiene (headers, secrets, private strings)
        run: sh scripts/check-repo.sh
      - run: npm ci --ignore-scripts
      - name: Audit dependencies
        run: npm audit --audit-level=low
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The built script in a real browser against official Wiki.js images (see docs/compatibility.md).
  compat:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - ghcr.io/requarks/wiki:2
          - ghcr.io/requarks/wiki:2.5.300
          - requarks/wiki:2.5.170
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Wiki.js ${{ matrix.image }}
        run: sh scripts/compat-wikijs.sh ${{ matrix.image }}
